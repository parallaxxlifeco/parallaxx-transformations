<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — preview</title>
<style>
  html,body{margin:0;padding:0;background:#04122A}
  /* Preview harness only, and it is the deployed arrangement exactly: ONE
     custom element, with PtNav v3 and PtFooter v3 baked inside it, the same
     as every other row in the README table.

       Source URL             parallaxx-contact.js
       Tag                    parallaxx-contact
       Site Header + Footer   OFF

     THE NAV ACTIVE STATE WILL LOOK WRONG HERE AND THAT IS CORRECT. The nav
     works out where it is from location.pathname, and its table maps
     /contact-daniel-lawson to the Contact pill. Open this file at that path
     -- on the deployed site, or through migration/serve.py -- and the pill
     lights up. Open it as contact.html and nothing matches, so nothing is
     marked active.

     contact-preview.html is a different thing and is generated by the build:
     the same page with the element flattened into the light DOM, for reading
     without a shadow root in the way. This file is the one that shows what
     the deploy will actually render. */
  parallaxx-contact{display:block}
</style>
</head>
<body>
  <parallaxx-contact></parallaxx-contact>
  <script src="./parallaxx-contact.js"></script>
</body>
