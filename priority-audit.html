<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Priority Audit — preview</title>
<style>
  html,body{margin:0;padding:0;background:#04122A}
  /* Preview harness only, and it is the Wix arrangement exactly: ONE custom
     element, with PtNav v3 and PtFooter v3 baked inside it, the same as the
     home, men, women, about and testimonials pages.

       Source URL             parallaxx-priority-audit.js
       Tag                    parallaxx-priority-audit
       Site Header + Footer   OFF

     THE CHROME IS BAKED IN AS OF 14 AUG, SO THIS PAGE NOW MATCHES EVERY
     OTHER ROW IN THE TABLE. It used to ship no nav and no footer, and the
     Wix chrome had to stay ON to give the page a way out of itself. PtNav
     v3 and PtFooter v3 are inside the bundle now, carrying the phone-column
     footer. Leave the Wix Header and Footer on and the page renders two of
     each.

     priority-audit-preview.html is a different thing and is generated by the
     build: a standalone page with its own minimal header, for reading the
     instrument without Wix in the way. This file is the one that shows what
     Wix will actually render.

     No ?v= needed. GitHub Pages ignores the query string and serves current
     bytes either way. Rebuild, push, and the page picks it up. */
  parallaxx-priority-audit{display:block}
</style>
</head>
<body>
  <parallaxx-priority-audit></parallaxx-priority-audit>
  <script src="./parallaxx-priority-audit.js"></script>
</body>
</html>
